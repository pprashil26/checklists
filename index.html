<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173a5e">
  <meta name="description" content="Checklists by LifeApps. Simple checklists for things worth doing right.">
  <title>Checklists</title>

  <style>
    /* =========================================================
       1. DESIGN TOKENS
       ========================================================= */
    :root {
      color-scheme: light;
      --navy-950: #102a43;
      --navy-900: #173a5e;
      --navy-800: #214f78;
      --blue-600: #2f6fa5;
      --blue-100: #e9f2fa;
      --page: #f4f7fa;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #17212b;
      --muted: #687684;
      --faint: #8b98a5;
      --border: #dbe3ea;
      --border-strong: #c7d2dc;
      --success: #2f7055;
      --success-soft: #e9f5ef;
      --danger: #a13d3d;
      --danger-soft: #fbeeee;
      --warning: #8a6116;
      --warning-soft: #fff6df;
      --shadow-sm: 0 1px 2px rgba(16, 42, 67, 0.06);
      --shadow-md: 0 10px 30px rgba(16, 42, 67, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --header-height: 58px;
      --content-max: 680px;
      --tap: 44px;
      --safe-top: max(env(safe-area-inset-top), 0px);
      --safe-right: max(env(safe-area-inset-right), 0px);
      --safe-bottom: max(env(safe-area-inset-bottom), 0px);
      --safe-left: max(env(safe-area-inset-left), 0px);
    }

    /* =========================================================
       2. RESET AND BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--page); }
    body {
      min-height: 100%;
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { touch-action: manipulation; }
    :focus-visible { outline: 3px solid rgba(47,111,165,.28); outline-offset: 2px; }
    [hidden] { display: none !important; }

    /* =========================================================
       3. APPLICATION SHELL
       ========================================================= */
    .app-shell { min-height: 100dvh; }
    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      min-height: calc(var(--header-height) + var(--safe-top));
      padding: var(--safe-top) calc(12px + var(--safe-right)) 0 calc(12px + var(--safe-left));
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .topbar-inner {
      width: min(100%, var(--content-max));
      min-height: var(--header-height);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand {
      border: 0;
      background: transparent;
      min-height: var(--tap);
      padding: 4px 6px 4px 2px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: .035em;
      color: var(--navy-900);
    }
    .brand-mark {
      width: 31px;
      height: 31px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--navy-900);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .topbar-spacer { flex: 1; }
    .icon-button {
      width: var(--tap);
      height: var(--tap);
      border: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: transparent;
      cursor: pointer;
    }
    .icon-button:hover { background: var(--surface-soft); }
    .icon-button svg { width: 21px; height: 21px; }
    .main {
      width: min(100%, var(--content-max));
      margin: 0 auto;
      padding: 18px calc(16px + var(--safe-right)) calc(96px + var(--safe-bottom)) calc(16px + var(--safe-left));
    }
    .view { animation: enter .16s ease-out; }
    @keyframes enter { from { opacity: .4; transform: translateY(2px); } }

    /* =========================================================
       4. COMMON COMPONENTS
       ========================================================= */
    .section { margin: 0 0 24px; }
    .section-heading {
      margin: 0 0 10px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .section-heading h2 {
      margin: 0;
      color: var(--navy-950);
      font-size: .78rem;
      letter-spacing: .075em;
      text-transform: uppercase;
    }
    .section-heading small { color: var(--muted); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .empty-state {
      padding: 34px 22px;
      text-align: center;
    }
    .empty-state-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--navy-900);
      background: var(--blue-100);
    }
    .empty-state h2 { margin: 0 0 7px; font-size: 1.08rem; }
    .empty-state p { margin: 0 auto 18px; max-width: 31ch; color: var(--muted); }
    .button {
      min-height: var(--tap);
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }
    .button-primary { background: var(--navy-900); color: white; }
    .button-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--navy-900); }
    .button-quiet { background: transparent; color: var(--navy-900); }
    .fab {
      position: fixed;
      z-index: 18;
      right: calc(18px + var(--safe-right));
      bottom: calc(18px + var(--safe-bottom));
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 17px;
      display: grid;
      place-items: center;
      background: var(--navy-900);
      color: white;
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }
    .fab svg { width: 25px; height: 25px; }
    .micro-help {
      margin-top: 18px;
      padding: 11px 13px;
      color: var(--muted);
      background: rgba(255,255,255,.58);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: .78rem;
    }

    /* =========================================================
       5. HOME AND CHECKLIST ROWS
       ========================================================= */
    .checklist-list { list-style: none; margin: 0; padding: 0; }
    .checklist-row + .checklist-row { border-top: 1px solid var(--border); }
    .checklist-row-button {
      width: 100%;
      min-height: 66px;
      margin: 0;
      padding: 11px 12px;
      border: 0;
      display: grid;
      grid-template-columns: 38px minmax(0,1fr) 22px;
      align-items: center;
      gap: 10px;
      text-align: left;
      background: var(--surface);
      cursor: pointer;
    }
    .checklist-row-button:hover { background: var(--surface-soft); }
    .row-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--navy-900);
      background: var(--blue-100);
      font-size: 1rem;
    }
    .row-title { display: block; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-meta { display: block; margin-top: 2px; color: var(--muted); font-size: .78rem; }
    .row-chevron { color: var(--faint); }
    .progress-track { height: 4px; overflow: hidden; border-radius: 999px; background: #e5ebf0; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--blue-600); transition: width .2s ease; }

    /* =========================================================
       6. SEARCH
       ========================================================= */
    .search-wrap { position: relative; }
    .search-input {
      width: 100%;
      min-height: 46px;
      padding: 10px 42px 10px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }
    .search-clear { position: absolute; top: 1px; right: 1px; }

    /* =========================================================
       7. RUN SCREEN
       ========================================================= */
    .screen-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 18px; }
    .back-button { flex: 0 0 auto; margin-left: -8px; }
    .screen-title { min-width: 0; flex: 1; }
    .screen-title h1 { margin: 2px 0 3px; font-size: 1.35rem; color: var(--navy-950); }
    .screen-title p { margin: 0; color: var(--muted); font-size: .84rem; }
    .pause-title {
      margin: 22px 2px 8px;
      color: var(--navy-800);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .run-item {
      width: 100%;
      min-height: 56px;
      padding: 8px 10px;
      border: 0;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 34px minmax(0,1fr);
      align-items: center;
      gap: 8px;
      text-align: left;
      background: var(--surface);
      cursor: pointer;
    }
    .run-item:first-child { border-top: 0; }
    .run-check {
      width: 25px;
      height: 25px;
      border: 2px solid var(--border-strong);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: transparent;
    }
    .run-item[aria-checked="true"] .run-check { border-color: var(--blue-600); background: var(--blue-600); color: white; }
    .run-item[aria-checked="true"] .run-label { color: var(--muted); }
    .run-label { font-size: 1.05rem; }
    .run-footer { position: sticky; bottom: calc(8px + var(--safe-bottom)); margin-top: 18px; padding: 12px; background: rgba(255,255,255,.97); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); }
    .run-footer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
    .run-count { color: var(--muted); font-size: .84rem; font-weight: 700; }

    /* =========================================================
       8. EDITOR AND FORMS
       ========================================================= */
    .form-group { margin-bottom: 18px; }
    .label { display: block; margin: 0 0 6px; color: var(--navy-950); font-size: .78rem; font-weight: 800; letter-spacing: .045em; text-transform: uppercase; }
    .input, .textarea, .select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--surface);
      color: var(--text);
    }
    .textarea { min-height: 88px; resize: vertical; }
    .item-editor-list { display: grid; gap: 8px; }
    .item-editor-row { display: grid; grid-template-columns: 32px minmax(0,1fr) 42px; gap: 7px; align-items: center; }
    .drag-handle { color: var(--faint); text-align: center; user-select: none; }
    .remove-item { color: var(--danger); }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
    details.advanced { border-top: 1px solid var(--border); padding-top: 14px; }
    details.advanced summary { min-height: var(--tap); display: flex; align-items: center; color: var(--navy-900); cursor: pointer; font-weight: 750; }

    /* =========================================================
       9. MENU, DIALOGS AND NOTICES
       ========================================================= */
    .menu {
      position: fixed;
      z-index: 30;
      top: calc(var(--safe-top) + 51px);
      right: calc(var(--safe-right) + 12px);
      width: min(260px, calc(100vw - 24px));
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }
    .menu button { width: 100%; min-height: 43px; padding: 8px 10px; border: 0; border-radius: 8px; text-align: left; background: transparent; cursor: pointer; }
    .menu button:hover { background: var(--surface-soft); }
    dialog {
      width: min(92vw, 430px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0;
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }
    dialog::backdrop { background: rgba(16,42,67,.42); backdrop-filter: blur(2px); }
    .dialog-body { padding: 20px; }
    .dialog-body h2 { margin: 0 0 8px; font-size: 1.16rem; color: var(--navy-950); }
    .dialog-body p { margin: 0; color: var(--muted); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; }
    .toast-region { position: fixed; z-index: 50; left: 50%; bottom: calc(82px + var(--safe-bottom)); width: min(92vw, 420px); transform: translateX(-50%); pointer-events: none; }
    .toast { padding: 11px 13px; border-radius: 10px; color: white; background: var(--navy-950); box-shadow: var(--shadow-md); text-align: center; font-size: .86rem; }
    .status-banner { margin-bottom: 16px; padding: 11px 13px; border-radius: 10px; color: var(--warning); background: var(--warning-soft); border: 1px solid #f0dbac; font-size: .82rem; }

    /* =========================================================
       10. RESPONSIVE AND ACCESSIBILITY
       ========================================================= */
    @media (min-width: 760px) {
      :root { --content-max: 760px; }
      .main { padding-top: 26px; }
      .fab { right: max(calc((100vw - var(--content-max)) / 2 + 18px), 24px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="brand" id="homeButton" type="button" aria-label="Go to Checklists home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 2 2 4-4"/><path d="M13 7h6"/><path d="m5 14 2 2 4-4"/><path d="M13 14h6"/><path d="M5 21h14"/></svg>
          </span>
          <span>CHECKLISTS</span>
        </button>
        <span class="topbar-spacer"></span>
        <button class="icon-button" id="searchButton" type="button" aria-label="Search checklists">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-button" id="menuButton" type="button" aria-label="Open menu" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
        </button>
      </div>
    </header>

    <main class="main" id="mainContent" tabindex="-1">
      <div id="statusBanner" class="status-banner" hidden></div>
      <section id="view-home" class="view" aria-labelledby="homeTitle">
        <h1 id="homeTitle" hidden>Checklists home</h1>
        <div id="homeContent"></div>
        <div class="micro-help">Open a checklist when you are ready to use it. Keep each checklist focused on the critical things you do not want to miss.</div>
      </section>

      <section id="view-search" class="view" hidden aria-labelledby="searchTitle">
        <div class="screen-header">
          <button class="icon-button back-button" type="button" data-action="home" aria-label="Back to home">←</button>
          <div class="screen-title"><h1 id="searchTitle">Search</h1><p>Find by checklist name, category or item.</p></div>
        </div>
        <div class="search-wrap">
          <input class="search-input" id="searchInput" type="search" placeholder="Search checklists" autocomplete="off">
          <button class="icon-button search-clear" id="clearSearchButton" type="button" aria-label="Clear search">×</button>
        </div>
        <div id="searchResults" class="section" style="margin-top:14px"></div>
      </section>

      <section id="view-run" class="view" hidden aria-labelledby="runTitle">
        <div id="runContent"></div>
      </section>

      <section id="view-editor" class="view" hidden aria-labelledby="editorTitle">
        <div id="editorContent"></div>
      </section>

      <section id="view-simple" class="view" hidden aria-labelledby="simpleTitle">
        <div id="simpleContent"></div>
      </section>
    </main>

    <button class="fab" id="newChecklistButton" type="button" aria-label="Create new checklist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <div class="menu" id="appMenu" role="menu" hidden>
      <button type="button" role="menuitem" data-page="categories">Categories</button>
      <button type="button" role="menuitem" data-page="archived">Archived</button>
      <button type="button" role="menuitem" data-page="backup">Backup &amp; Restore</button>
      <button type="button" role="menuitem" data-page="help">Help</button>
      <button type="button" role="menuitem" data-page="settings">Settings</button>
    </div>

    <dialog id="confirmDialog">
      <div class="dialog-body"><h2 id="confirmTitle">Confirm</h2><p id="confirmMessage"></p></div>
      <div class="dialog-actions">
        <button class="button button-secondary" id="confirmCancel" type="button">Cancel</button>
        <button class="button button-primary" id="confirmAccept" type="button">Continue</button>
      </div>
    </dialog>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script>
    "use strict";

    /* =========================================================
       1. APPLICATION CONSTANTS
       ========================================================= */
    const APP = Object.freeze({
      name: "Checklists",
      version: "0.1.0",
      dbName: "lifeapps_checklists",
      dbVersion: 1,
      startupKey: "lifeapps.checklists.startup.v1"
    });

    const STORES = Object.freeze({
      checklists: "checklists",
      runs: "runs",
      categories: "categories",
      settings: "settings",
      snapshots: "snapshots",
      auditLog: "auditLog"
    });

    const CHECKLIST_MODE = Object.freeze({ READ_DO: "READ_DO", DO_CONFIRM: "DO_CONFIRM" });
    const CHECKLIST_STATUS = Object.freeze({ ACTIVE: "ACTIVE", ARCHIVED: "ARCHIVED" });
    const RUN_STATUS = Object.freeze({ ACTIVE: "ACTIVE", COMPLETED: "COMPLETED", ABANDONED: "ABANDONED" });

    /* =========================================================
       2. APPLICATION STATE
       ========================================================= */
    const state = {
      db: null,
      view: "home",
      checklists: [],
      categories: [],
      activeRuns: [],
      currentChecklistId: null,
      currentRunId: null,
      editingChecklistId: null
    };

    /* =========================================================
       3. GENERAL UTILITIES
       ========================================================= */
    const $ = selector => document.querySelector(selector);
    const $$ = selector => Array.from(document.querySelectorAll(selector));
    const nowISO = () => new Date().toISOString();
    const makeId = prefix => `${prefix}_${crypto.randomUUID()}`;
    const escapeHTML = value => String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    const normalizeSearch = value => String(value || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase().replace(/\s+/g, " ").trim();
    const requestToPromise = request => new Promise((resolve, reject) => { request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); });
    const transactionDone = tx => new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onabort = () => reject(tx.error || new Error("Transaction aborted")); tx.onerror = () => reject(tx.error); });

    function showToast(message) {
      const region = $("#toastRegion");
      region.innerHTML = `<div class="toast">${escapeHTML(message)}</div>`;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { region.innerHTML = ""; }, 2600);
    }

    function setStatus(message = "") {
      const banner = $("#statusBanner");
      banner.textContent = message;
      banner.hidden = !message;
    }

    function iconFor(name) {
      const icons = { home: "⌂", plane: "✈", briefcase: "▣", car: "◆", health: "+", family: "●", checklist: "✓" };
      return icons[name] || "✓";
    }

    /* =========================================================
       4. INDEXEDDB DATABASE AND V1 MIGRATION
       ========================================================= */
    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(APP.dbName, APP.dbVersion);
        request.onupgradeneeded = event => createV1Database(event.target.result);
        request.onsuccess = () => {
          const db = request.result;
          db.onversionchange = () => db.close();
          resolve(db);
        };
        request.onerror = () => reject(request.error);
        request.onblocked = () => setStatus("Close other open Checklists tabs to finish the update.");
      });
    }

    function createV1Database(db) {
      if (!db.objectStoreNames.contains(STORES.checklists)) {
        const store = db.createObjectStore(STORES.checklists, { keyPath: "id" });
        store.createIndex("by_status", "status", { unique: false });
        store.createIndex("by_category", "categoryId", { unique: false });
        store.createIndex("by_updated", "updatedAt", { unique: false });
        store.createIndex("by_last_started", "usage.lastStartedAt", { unique: false });
        store.createIndex("by_category_status", ["categoryId", "status"], { unique: false });
      }
      if (!db.objectStoreNames.contains(STORES.runs)) {
        const store = db.createObjectStore(STORES.runs, { keyPath: "id" });
        store.createIndex("by_checklist", "checklistId", { unique: false });
        store.createIndex("by_status", "status", { unique: false });
        store.createIndex("by_checklist_status", ["checklistId", "status"], { unique: false });
        store.createIndex("by_started", "startedAt", { unique: false });
        store.createIndex("by_completed", "completedAt", { unique: false });
      }
      if (!db.objectStoreNames.contains(STORES.categories)) {
        const store = db.createObjectStore(STORES.categories, { keyPath: "id" });
        store.createIndex("by_status", "status", { unique: false });
        store.createIndex("by_name", "name", { unique: false });
        store.createIndex("by_position", "position", { unique: false });
      }
      if (!db.objectStoreNames.contains(STORES.settings)) db.createObjectStore(STORES.settings, { keyPath: "key" });
      if (!db.objectStoreNames.contains(STORES.snapshots)) {
        const store = db.createObjectStore(STORES.snapshots, { keyPath: "id" });
        store.createIndex("by_created", "createdAt", { unique: false });
        store.createIndex("by_type", "snapshotType", { unique: false });
      }
      if (!db.objectStoreNames.contains(STORES.auditLog)) {
        const store = db.createObjectStore(STORES.auditLog, { keyPath: "id" });
        store.createIndex("by_occurred", "occurredAt", { unique: false });
        store.createIndex("by_action", "action", { unique: false });
        store.createIndex("by_entity", ["entityType", "entityId"], { unique: false });
      }
    }

    async function seedInitialData() {
      const tx = state.db.transaction([STORES.categories, STORES.settings], "readwrite");
      const settings = tx.objectStore(STORES.settings);
      const existing = await requestToPromise(settings.get("app"));
      if (!existing) {
        const createdAt = nowISO();
        const categories = [
          ["cat_home", "Home", "home", 1000],
          ["cat_travel", "Travel", "plane", 2000],
          ["cat_work", "Work", "briefcase", 3000],
          ["cat_other", "Other", "checklist", 9000]
        ];
        for (const [id, name, icon, position] of categories) {
          tx.objectStore(STORES.categories).add({ id, recordType: "category", schemaVersion: 1, name, icon, position, status: "ACTIVE", isSystem: true, createdAt, updatedAt: createdAt, archivedAt: null });
        }
        settings.add({ key: "app", schemaVersion: 1, value: { applicationVersion: APP.version, createdAt, firstLaunchCompleted: false }, updatedAt: createdAt });
        settings.add({ key: "preferences", schemaVersion: 1, value: { appearance: "SYSTEM", returnHomeAfterCompletion: true, showContextualHelp: true }, updatedAt: createdAt });
        settings.add({ key: "backup", schemaVersion: 1, value: { lastBackupAt: null, lastBackupChecksum: null }, updatedAt: createdAt });
      }
      await transactionDone(tx);
    }

    /* =========================================================
       5. DATA ACCESS HELPERS
       ========================================================= */
    async function getAll(storeName) {
      const tx = state.db.transaction(storeName, "readonly");
      const records = await requestToPromise(tx.objectStore(storeName).getAll());
      await transactionDone(tx);
      return records;
    }

    async function putRecord(storeName, record) {
      const tx = state.db.transaction(storeName, "readwrite");
      await requestToPromise(tx.objectStore(storeName).put(record));
      await transactionDone(tx);
      return record;
    }

    async function loadApplicationData() {
      const [checklists, categories, runs] = await Promise.all([
        getAll(STORES.checklists), getAll(STORES.categories), getAll(STORES.runs)
      ]);
      state.checklists = checklists;
      state.categories = categories.sort((a,b) => a.position - b.position);
      state.activeRuns = runs.filter(run => run.status === RUN_STATUS.ACTIVE).sort((a,b) => String(b.lastActivityAt).localeCompare(String(a.lastActivityAt)));
    }

    /* =========================================================
       6. CHECKLIST AND RUN SERVICES
       ========================================================= */
    function categoryName(categoryId) {
      return state.categories.find(category => category.id === categoryId)?.name || "Other";
    }

    function buildSearchText(checklist) {
      return normalizeSearch([checklist.title, categoryName(checklist.categoryId), checklist.notes, ...checklist.pausePoints.map(p => p.title), ...checklist.items.map(i => i.text)].join(" "));
    }

    async function saveChecklistFromForm(form) {
      const formData = new FormData(form);
      const title = String(formData.get("title") || "").trim();
      const itemTexts = $$("[data-item-input]").map(input => input.value.trim()).filter(Boolean);
      if (!title) throw new Error("Enter a checklist name.");
      if (!itemTexts.length) throw new Error("Add at least one checklist item.");

      const existing = state.checklists.find(item => item.id === state.editingChecklistId);
      const timestamp = nowISO();
      const record = {
        id: existing?.id || makeId("cl"), recordType: "checklist", schemaVersion: 1,
        revision: existing ? existing.revision + 1 : 1,
        title, categoryId: String(formData.get("categoryId") || "cat_other"),
        icon: String(formData.get("icon") || "checklist"), mode: String(formData.get("mode") || CHECKLIST_MODE.READ_DO),
        notes: String(formData.get("notes") || "").trim(), pausePoints: existing?.pausePoints || [],
        items: itemTexts.map((text, index) => ({ id: existing?.items?.[index]?.id || makeId("item"), text, position: (index + 1) * 1000, pausePointId: existing?.items?.[index]?.pausePointId || null })),
        status: existing?.status || CHECKLIST_STATUS.ACTIVE,
        usage: existing?.usage || { lastStartedAt: null, lastCompletedAt: null, startedRunCount: 0, completedRunCount: 0 },
        searchText: "", createdAt: existing?.createdAt || timestamp, updatedAt: timestamp, archivedAt: existing?.archivedAt || null
      };
      record.searchText = buildSearchText(record);
      await putRecord(STORES.checklists, record);
      await loadApplicationData();
      showToast(existing ? "Checklist updated" : "Checklist created");
      navigate("home");
    }

    async function openChecklist(checklistId) {
      let run = state.activeRuns.find(item => item.checklistId === checklistId);
      if (!run) {
        const checklist = state.checklists.find(item => item.id === checklistId);
        if (!checklist) return;
        const timestamp = nowISO();
        run = {
          id: makeId("run"), recordType: "checklistRun", schemaVersion: 1,
          checklistId, checklistRevision: checklist.revision, status: RUN_STATUS.ACTIVE,
          snapshot: { title: checklist.title, categoryId: checklist.categoryId, categoryName: categoryName(checklist.categoryId), icon: checklist.icon, mode: checklist.mode, notes: checklist.notes, pausePoints: structuredClone(checklist.pausePoints), items: structuredClone(checklist.items) },
          itemStates: Object.fromEntries(checklist.items.map(item => [item.id, { checked: false, checkedAt: null }])),
          totalItems: checklist.items.length, checkedItems: 0,
          startedAt: timestamp, lastActivityAt: timestamp, completedAt: null, abandonedAt: null, completionDurationMs: null, createdAt: timestamp, updatedAt: timestamp
        };
        await putRecord(STORES.runs, run);
        checklist.usage.lastStartedAt = timestamp;
        checklist.usage.startedRunCount += 1;
        await putRecord(STORES.checklists, checklist);
        await loadApplicationData();
      }
      state.currentRunId = run.id;
      navigate("run");
    }

    async function toggleRunItem(itemId) {
      const run = state.activeRuns.find(item => item.id === state.currentRunId);
      if (!run || !run.itemStates[itemId]) return;
      const timestamp = nowISO();
      const checked = !run.itemStates[itemId].checked;
      run.itemStates[itemId] = { checked, checkedAt: checked ? timestamp : null };
      run.checkedItems = Object.values(run.itemStates).filter(value => value.checked).length;
      run.lastActivityAt = timestamp;
      run.updatedAt = timestamp;
      await putRecord(STORES.runs, run);
      renderRun();
    }

    async function completeRun() {
      const run = state.activeRuns.find(item => item.id === state.currentRunId);
      if (!run || run.checkedItems !== run.totalItems) return;
      const timestamp = nowISO();
      run.status = RUN_STATUS.COMPLETED;
      run.completedAt = timestamp;
      run.completionDurationMs = Date.parse(timestamp) - Date.parse(run.startedAt);
      run.updatedAt = timestamp;
      await putRecord(STORES.runs, run);
      const checklist = state.checklists.find(item => item.id === run.checklistId);
      if (checklist) {
        checklist.usage.lastCompletedAt = timestamp;
        checklist.usage.completedRunCount += 1;
        await putRecord(STORES.checklists, checklist);
      }
      await loadApplicationData();
      showToast("Checklist complete");
      navigate("home");
    }

    /* =========================================================
       7. VIEW NAVIGATION
       ========================================================= */
    function navigate(view, options = {}) {
      state.view = view;
      $$(".view").forEach(element => element.hidden = true);
      $("#newChecklistButton").hidden = view !== "home";
      $("#appMenu").hidden = true;
      $("#menuButton").setAttribute("aria-expanded", "false");
      const target = $(`#view-${view === "categories" || view === "archived" || view === "backup" || view === "help" || view === "settings" ? "simple" : view}`);
      if (target) target.hidden = false;
      if (view === "home") renderHome();
      if (view === "search") { renderSearch(); setTimeout(() => $("#searchInput")?.focus({ preventScroll: true }), 0); }
      if (view === "run") renderRun();
      if (view === "editor") renderEditor(options.checklistId || null);
      if (["categories","archived","backup","help","settings"].includes(view)) renderSimplePage(view);
      $("#mainContent").focus({ preventScroll: true });
      scrollTo({ top: 0, behavior: "instant" });
    }

    /* =========================================================
       8. VIEW RENDERING
       ========================================================= */
    function checklistRows(checklists, activeRuns = []) {
      if (!checklists.length) return "";
      return `<div class="card"><ul class="checklist-list">${checklists.map(checklist => {
        const run = activeRuns.find(item => item.checklistId === checklist.id);
        const meta = run ? `${run.checkedItems} of ${run.totalItems} · In progress` : categoryName(checklist.categoryId);
        return `<li class="checklist-row"><button class="checklist-row-button" type="button" data-open-checklist="${checklist.id}"><span class="row-icon" aria-hidden="true">${iconFor(checklist.icon)}</span><span><span class="row-title">${escapeHTML(checklist.title)}</span><span class="row-meta">${escapeHTML(meta)}</span></span><span class="row-chevron" aria-hidden="true">›</span></button></li>`;
      }).join("")}</ul></div>`;
    }

    function renderHome() {
      const active = state.activeRuns.map(run => state.checklists.find(item => item.id === run.checklistId)).filter(Boolean);
      const all = state.checklists.filter(item => item.status === CHECKLIST_STATUS.ACTIVE).sort((a,b) => a.title.localeCompare(b.title));
      const frequently = all.filter(item => item.usage.startedRunCount > 0 && !active.some(activeItem => activeItem.id === item.id)).sort((a,b) => String(b.usage.lastStartedAt).localeCompare(String(a.usage.lastStartedAt))).slice(0,4);
      const content = [];
      if (active.length) content.push(`<section class="section"><div class="section-heading"><h2>Continue</h2></div>${checklistRows(active, state.activeRuns)}</section>`);
      if (frequently.length) content.push(`<section class="section"><div class="section-heading"><h2>Frequently used</h2></div>${checklistRows(frequently)}</section>`);
      if (all.length) content.push(`<section class="section"><div class="section-heading"><h2>All checklists</h2><small>${all.length}</small></div>${checklistRows(all, state.activeRuns)}</section>`);
      if (!all.length) content.push(`<div class="card empty-state"><div class="empty-state-icon">✓</div><h2>Your checklists will appear here</h2><p>Create short, reusable checklists for things worth doing right.</p><button class="button button-primary" type="button" data-action="new">Create first checklist</button></div>`);
      $("#homeContent").innerHTML = content.join("");
    }

    function renderSearch() {
      $("#searchInput").value = "";
      renderSearchResults("");
    }

    function renderSearchResults(query) {
      const normalized = normalizeSearch(query);
      const results = !normalized ? [] : state.checklists.filter(item => item.status === CHECKLIST_STATUS.ACTIVE && item.searchText.includes(normalized));
      $("#searchResults").innerHTML = !normalized ? `<div class="micro-help">Start typing to search checklist names, categories and item text.</div>` : results.length ? checklistRows(results, state.activeRuns) : `<div class="card empty-state"><h2>No checklists found</h2><p>Try another name, category or checklist item.</p></div>`;
    }

    function renderRun() {
      const run = state.activeRuns.find(item => item.id === state.currentRunId);
      if (!run) { navigate("home"); return; }
      const groups = new Map([["", []]]);
      run.snapshot.pausePoints.forEach(point => groups.set(point.id, []));
      run.snapshot.items.sort((a,b) => a.position-b.position).forEach(item => (groups.get(item.pausePointId || "") || groups.get("")).push(item));
      let itemsHTML = "";
      const renderItems = items => `<div class="card">${items.map(item => { const checked = !!run.itemStates[item.id]?.checked; return `<button class="run-item" type="button" role="checkbox" aria-checked="${checked}" data-toggle-item="${item.id}"><span class="run-check" aria-hidden="true">✓</span><span class="run-label">${escapeHTML(item.text)}</span></button>`; }).join("")}</div>`;
      if (groups.get("").length) itemsHTML += renderItems(groups.get(""));
      run.snapshot.pausePoints.sort((a,b) => a.position-b.position).forEach(point => { const items = groups.get(point.id) || []; if (items.length) itemsHTML += `<div class="pause-title">${escapeHTML(point.title)}</div>${renderItems(items)}`; });
      const percent = run.totalItems ? Math.round(run.checkedItems / run.totalItems * 100) : 0;
      $("#runContent").innerHTML = `<div class="screen-header"><button class="icon-button back-button" type="button" data-action="home" aria-label="Back to home">←</button><div class="screen-title"><h1 id="runTitle">${escapeHTML(run.snapshot.title)}</h1><p>${run.snapshot.mode === CHECKLIST_MODE.DO_CONFIRM ? "Final check" : "Step by step"}</p></div><button class="icon-button" type="button" data-action="edit-current" aria-label="Edit checklist">⋮</button></div>${itemsHTML}<div class="run-footer"><div class="progress-track" aria-hidden="true"><div class="progress-fill" style="width:${percent}%"></div></div><div class="run-footer-row"><span class="run-count">${run.checkedItems} of ${run.totalItems} complete</span>${run.checkedItems === run.totalItems ? `<button class="button button-primary" type="button" data-action="complete-run">Done</button>` : ""}</div></div>`;
    }

    function renderEditor(checklistId = null) {
      state.editingChecklistId = checklistId;
      const checklist = state.checklists.find(item => item.id === checklistId) || null;
      const items = checklist?.items?.length ? checklist.items : [{ text: "" }, { text: "" }, { text: "" }];
      const categories = state.categories.filter(item => item.status === "ACTIVE");
      $("#editorContent").innerHTML = `<div class="screen-header"><button class="icon-button back-button" type="button" data-action="home" aria-label="Back to home">←</button><div class="screen-title"><h1 id="editorTitle">${checklist ? "Edit checklist" : "New checklist"}</h1><p>Capture only the critical things you do not want to miss.</p></div></div><form id="checklistForm"><div class="form-group"><label class="label" for="titleInput">Name</label><input class="input" id="titleInput" name="title" maxlength="120" value="${escapeHTML(checklist?.title || "")}" placeholder="e.g. Before leaving for airport" required></div><div class="form-group"><span class="label">Items</span><div class="item-editor-list" id="itemEditorList">${items.map(item => editorItemRow(item.text || "")).join("")}</div><button class="button button-quiet" type="button" data-action="add-item">+ Add item</button></div><details class="advanced"><summary>More options</summary><div class="form-group"><label class="label" for="categorySelect">Category</label><select class="select" id="categorySelect" name="categoryId">${categories.map(category => `<option value="${category.id}" ${category.id === (checklist?.categoryId || "cat_other") ? "selected" : ""}>${escapeHTML(category.name)}</option>`).join("")}</select></div><div class="form-group"><label class="label" for="iconSelect">Icon</label><select class="select" id="iconSelect" name="icon"><option value="checklist">Checklist</option><option value="home">Home</option><option value="plane">Travel</option><option value="briefcase">Work</option><option value="car">Car</option><option value="health">Health</option></select></div><div class="form-group"><label class="label" for="modeSelect">Checklist style</label><select class="select" id="modeSelect" name="mode"><option value="READ_DO" ${checklist?.mode !== CHECKLIST_MODE.DO_CONFIRM ? "selected" : ""}>Step by step</option><option value="DO_CONFIRM" ${checklist?.mode === CHECKLIST_MODE.DO_CONFIRM ? "selected" : ""}>Final check</option></select></div><div class="form-group"><label class="label" for="notesInput">Notes</label><textarea class="textarea" id="notesInput" name="notes" maxlength="2000">${escapeHTML(checklist?.notes || "")}</textarea></div></details><div class="form-actions"><button class="button button-secondary" type="button" data-action="home">Cancel</button><button class="button button-primary" type="submit">Save</button></div></form>`;
      const iconSelect = $("#iconSelect"); if (checklist) iconSelect.value = checklist.icon;
      setTimeout(() => $("#titleInput")?.focus({ preventScroll: true }), 0);
    }

    function editorItemRow(value = "") {
      return `<div class="item-editor-row"><span class="drag-handle" aria-hidden="true">⋮⋮</span><input class="input" data-item-input maxlength="300" value="${escapeHTML(value)}" placeholder="Checklist item"><button class="icon-button remove-item" type="button" data-action="remove-item" aria-label="Remove item">×</button></div>`;
    }

    function renderSimplePage(page) {
      const pages = {
        categories: ["Categories", "V1 uses the default Home, Travel, Work and Other categories. Full category management is reserved for the next implementation stage."],
        archived: ["Archived", "Archived checklists will appear here and remain available for restoration."],
        backup: ["Backup & Restore", "The IndexedDB foundation is ready for portable JSON backup, SHA-256 validation and safe restore implementation."],
        settings: ["Settings", `Checklists ${APP.version}. Appearance and completion preferences will be added after the core run workflow is validated.`],
        help: ["Help", "Good checklists are short. Include the critical steps that are important and easy to miss. Use Step by step while performing an activity, or Final check when confirming completed work."]
      };
      const [title, text] = pages[page];
      $("#simpleContent").innerHTML = `<div class="screen-header"><button class="icon-button back-button" type="button" data-action="home" aria-label="Back to home">←</button><div class="screen-title"><h1 id="simpleTitle">${title}</h1></div></div><div class="card empty-state"><h2>${title}</h2><p>${text}</p><button class="button button-secondary" type="button" data-action="home">Back to Checklists</button></div>`;
    }

    /* =========================================================
       9. EVENT HANDLING
       ========================================================= */
    document.addEventListener("click", async event => {
      const actionElement = event.target.closest("[data-action]");
      const openElement = event.target.closest("[data-open-checklist]");
      const toggleElement = event.target.closest("[data-toggle-item]");
      const pageElement = event.target.closest("[data-page]");

      if (openElement) return openChecklist(openElement.dataset.openChecklist);
      if (toggleElement) return toggleRunItem(toggleElement.dataset.toggleItem);
      if (pageElement) return navigate(pageElement.dataset.page);
      if (!actionElement) return;

      const action = actionElement.dataset.action;
      if (action === "home") navigate("home");
      if (action === "new") navigate("editor");
      if (action === "add-item") { $("#itemEditorList").insertAdjacentHTML("beforeend", editorItemRow()); $$("[data-item-input]").at(-1)?.focus(); }
      if (action === "remove-item") actionElement.closest(".item-editor-row")?.remove();
      if (action === "edit-current") { const run = state.activeRuns.find(item => item.id === state.currentRunId); if (run) navigate("editor", { checklistId: run.checklistId }); }
      if (action === "complete-run") completeRun();
    });

    $("#homeButton").addEventListener("click", () => navigate("home"));
    $("#newChecklistButton").addEventListener("click", () => navigate("editor"));
    $("#searchButton").addEventListener("click", () => navigate("search"));
    $("#menuButton").addEventListener("click", () => { const menu = $("#appMenu"); menu.hidden = !menu.hidden; $("#menuButton").setAttribute("aria-expanded", String(!menu.hidden)); });
    $("#searchInput").addEventListener("input", event => renderSearchResults(event.target.value));
    $("#clearSearchButton").addEventListener("click", () => { $("#searchInput").value = ""; renderSearchResults(""); $("#searchInput").focus(); });

    document.addEventListener("submit", async event => {
      if (event.target.id !== "checklistForm") return;
      event.preventDefault();
      try { await saveChecklistFromForm(event.target); }
      catch (error) { showToast(error.message || "Checklist could not be saved"); }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !$("#appMenu").hidden) { $("#appMenu").hidden = true; $("#menuButton").setAttribute("aria-expanded", "false"); }
      if (event.key === "Enter" && event.target.matches("[data-item-input]") && !event.shiftKey) {
        event.preventDefault();
        const row = event.target.closest(".item-editor-row");
        row.insertAdjacentHTML("afterend", editorItemRow());
        row.nextElementSibling.querySelector("[data-item-input]").focus();
      }
    });

    /* =========================================================
       10. PWA HOOK
       ========================================================= */
    function registerServiceWorker() {
      if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
      navigator.serviceWorker.register("./service-worker.js").catch(() => {
        setStatus("Offline installation is not active yet. The app itself remains available.");
      });
    }

    /* =========================================================
       11. APPLICATION INITIALISATION
       ========================================================= */
    async function initialiseApp() {
      try {
        if (!window.indexedDB) throw new Error("IndexedDB is unavailable in this browser.");
        state.db = await openDatabase();
        await seedInitialData();
        await loadApplicationData();
        localStorage.setItem(APP.startupKey, JSON.stringify({ applicationVersion: APP.version, databaseVersion: APP.dbVersion, lastSuccessfulOpenAt: nowISO(), integrityStatus: "HEALTHY" }));
        registerServiceWorker();
        navigate("home");
      } catch (error) {
        console.error(error);
        setStatus("Checklists data could not be opened. Existing browser data has not been replaced.");
        $("#homeContent").innerHTML = `<div class="card empty-state"><h2>Checklists could not start</h2><p>${escapeHTML(error.message || "Unknown storage error")}</p><button class="button button-primary" type="button" onclick="location.reload()">Retry</button></div>`;
      }
    }

    initialiseApp();
  </script>
</body>
</html>

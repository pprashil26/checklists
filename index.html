<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Checklists</title>
<style>
:root{--navy:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--white:#fff;--red:#dc2626;--green:#047857}*{box-sizing:border-box}html,body{margin:0;background:#eef2f7;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:620px;min-height:100dvh;margin:auto;background:var(--bg)}header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}.top{display:flex;align-items:center;gap:6px;min-height:44px}.logo{width:36px;height:36px;border-radius:12px;background:var(--navy);color:white;display:grid;place-items:center;font-weight:900}.brand{flex:1;min-width:0;border:0;background:none;text-align:left}.brand b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;color:var(--muted);font-size:10px}.icon{min-width:44px;min-height:44px;border:0;border-radius:12px;background:transparent;color:#475569}.primary{background:var(--navy);color:#fff}.search{position:relative;margin-top:8px}.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:0 42px 0 14px;font-size:16px}.clear{position:absolute;right:0;top:0}.chips{display:flex;gap:6px;overflow:auto;margin-top:8px;scrollbar-width:none}.chip{flex:none;min-height:36px;border:0;border-radius:99px;padding:0 12px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:700}.chip.active{background:var(--navy);color:#fff}main{padding:12px 12px max(30px,env(safe-area-inset-bottom))}.section-title{margin:8px 2px;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card,.panel,.item{background:#fff;border:1px solid var(--line);border-radius:16px}.card{padding:12px;margin-bottom:8px}.cardrow{display:flex;align-items:center;gap:8px}.open{flex:1;min-width:0;min-height:48px;border:0;background:none;text-align:left}.open b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:12px;color:var(--muted);margin-top:3px}.match{font-size:12px;color:#1d4ed8;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--navy);border-radius:99px}.card .bar{margin-top:6px}.empty{text-align:center;color:var(--muted);margin-top:80px;font-size:14px}.progress{background:white;border-radius:16px;padding:12px;margin-bottom:12px}.prow,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.actions{margin-bottom:12px}.btn{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-weight:700}.btn.primary{border-color:var(--navy);background:var(--navy)}.item{display:flex;align-items:center;gap:6px;min-height:56px;padding:0 8px;margin-bottom:8px}.check{width:44px;height:44px;border:0;background:none;display:grid;place-items:center}.box{width:28px;height:28px;border:1px solid #cbd5e1;border-radius:8px;display:grid;place-items:center}.done .box{background:var(--navy);color:#fff;border-color:var(--navy)}.itemtext{flex:1;min-width:0;min-height:50px;border:0;background:none;text-align:left;font-size:15px}.done .itemtext{text-decoration:line-through;color:#94a3b8}.danger{color:var(--red)}.notice,.error{margin:12px;border-radius:12px;padding:12px;font-size:13px}.notice{background:#ecfdf5;color:var(--green)}.error{background:#fef2f2;color:#b91c1c}.overlay{position:fixed;inset:0;z-index:50;background:#0f172a70;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:440px;max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:14px 20px max(20px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px #0002}.handle{width:36px;height:4px;background:#cbd5e1;border-radius:99px;margin:0 auto 12px}.sheethead{display:flex;align-items:center;justify-content:space-between}.field{display:block;font-size:13px;font-weight:700;margin-top:12px}.field input,.field select{display:block;width:100%;min-height:48px;margin-top:6px;border:1px solid #cbd5e1;border-radius:14px;padding:0 14px;background:#fff;font-size:16px}.save{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:800}.backup .option{width:100%;min-height:64px;margin-top:10px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 14px;text-align:left}.backup .warn{margin-top:14px;border-radius:12px;background:#fffbeb;color:#92400e;padding:12px;font-size:12px;line-height:1.5}@media(min-width:640px){.app{box-shadow:0 0 30px #0f172a18}.overlay{align-items:center;padding:20px}.sheet{border-radius:24px}}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{'use strict';
const DB_NAME='lifeapps-checklists',DB_VERSION=1,APP_VERSION='0.2.6',BACKUP_FORMAT='lifeapps-checklists-backup',BACKUP_SCHEMA=1;
const STORES={checklists:'checklists',items:'items',categories:'categories',settings:'settings'};
const SYSTEM=[['cat_personal','Personal',100],['cat_home','Home',200],['cat_travel','Travel',300],['cat_work','Work',400],['cat_shopping','Shopping',500],['cat_other','Other',600]];
let db, state={checklists:[],items:[],categories:[],selectedId:null,query:'',category:'all',view:'home',modal:null,menu:false,message:'',error:''};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString(), id=p=>p+'_'+crypto.randomUUID(), clean=v=>String(v??'').trim(), norm=v=>clean(v).toLocaleLowerCase();
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}), done=t=>new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||Error('Transaction aborted'))});
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('checklists')){const s=d.createObjectStore('checklists',{keyPath:'id'});s.createIndex('by_archived','archived');s.createIndex('by_category','categoryId');s.createIndex('by_updated','updatedAt')}if(!d.objectStoreNames.contains('items')){const s=d.createObjectStore('items',{keyPath:'id'});s.createIndex('by_checklist','checklistId');s.createIndex('by_checklist_sort',['checklistId','sortOrder'])}if(!d.objectStoreNames.contains('categories')){const s=d.createObjectStore('categories',{keyPath:'id'});s.createIndex('by_name','name')}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function seed(){const t=db.transaction(['categories','settings'],'readwrite'),cs=t.objectStore('categories');if(!(await rq(cs.count()))){const z=now();SYSTEM.forEach(([id,name,sortOrder])=>cs.add({id,name,sortOrder,isSystem:true,createdAt:z,updatedAt:z}))}if(!(await rq(t.objectStore('settings').get('general'))))t.objectStore('settings').put({key:'general',value:{defaultView:'home',updatedAt:now()}});await done(t)}
async function all(s){return rq(db.transaction(s,'readonly').objectStore(s).getAll())}
async function refresh(){[state.checklists,state.categories,state.items]=await Promise.all([all('checklists'),all('categories'),all('items')]);state.categories.sort((a,b)=>a.sortOrder-b.sortOrder);render()}
async function createChecklist(title,categoryId){title=clean(title);if(!title)throw Error('Checklist title is required.');const z=now(),r={id:id('cl'),title,categoryId:categoryId||null,pinned:false,archived:false,sortOrder:(state.checklists.length+1)*1000,createdAt:z,updatedAt:z},t=db.transaction('checklists','readwrite');t.objectStore('checklists').add(r);await done(t);return r}
async function updateChecklist(c,p){const title=p.title===undefined?c.title:clean(p.title);if(!title)throw Error('Checklist title is required.');const t=db.transaction('checklists','readwrite');t.objectStore('checklists').put({...c,...p,title,updatedAt:now()});await done(t)}
async function deleteChecklist(cid){const t=db.transaction(['checklists','items'],'readwrite'),idx=t.objectStore('items').index('by_checklist');await new Promise((res,rej)=>{const c=idx.openCursor(IDBKeyRange.only(cid));c.onsuccess=e=>{const x=e.target.result;if(!x)return res();x.delete();x.continue()};c.onerror=()=>rej(c.error)});t.objectStore('checklists').delete(cid);await done(t)}
function checklistItems(cid){return state.items.filter(x=>x.checklistId===cid).sort((a,b)=>a.sortOrder-b.sortOrder)}
async function createItem(cid,text){text=clean(text);if(!text)throw Error('Item text is required.');const a=checklistItems(cid),z=now(),t=db.transaction('items','readwrite');t.objectStore('items').add({id:id('item'),checklistId:cid,text,completed:false,sortOrder:(a.length+1)*1000,createdAt:z,updatedAt:z});await done(t)}
async function updateItem(i,p){const text=p.text===undefined?i.text:clean(p.text);if(!text)throw Error('Item text is required.');const t=db.transaction('items','readwrite');t.objectStore('items').put({...i,...p,text,updatedAt:now()});await done(t)}
async function deleteItem(iid){const t=db.transaction('items','readwrite');t.objectStore('items').delete(iid);await done(t)}
async function resetChecklist(cid){const t=db.transaction('items','readwrite'),idx=t.objectStore('items').index('by_checklist'),z=now();await new Promise((res,rej)=>{const c=idx.openCursor(IDBKeyRange.only(cid));c.onsuccess=e=>{const x=e.target.result;if(!x)return res();if(x.value.completed)x.update({...x.value,completed:false,updatedAt:z});x.continue()};c.onerror=()=>rej(c.error)});await done(t)}
const prog=a=>{const total=a.length,completed=a.filter(x=>x.completed).length;return{total,completed,percent:total?Math.round(completed/total*100):0}};
function catName(id){return state.categories.find(c=>c.id===id)?.name||'No category'}
function bar(p){return `<div class="bar"><i style="width:${p.percent}%"></i></div>`}
async function act(fn){try{state.error='';state.message='';await fn();await refresh()}catch(e){state.error=e.message||'The change could not be saved.';render()}}
async function makeBackup(){const [checklists,items,categories,settings]=await Promise.all(Object.values(STORES).map(all));return{app:'LIFEAPPS Checklists',format:BACKUP_FORMAT,schemaVersion:BACKUP_SCHEMA,appVersion:APP_VERSION,exportedAt:now(),data:{checklists,items,categories,settings}}}
function validateBackup(b){if(!b||b.format!==BACKUP_FORMAT)throw Error('This is not a Checklists backup.');if(b.schemaVersion!==BACKUP_SCHEMA)throw Error('Unsupported backup schema.');if(!b.data||!['checklists','items','categories','settings'].every(k=>Array.isArray(b.data[k])))throw Error('Backup is incomplete or damaged.');const ids=new Set(b.data.checklists.map(x=>x.id));if(b.data.checklists.some(x=>!x?.id||!clean(x.title)))throw Error('Backup contains an invalid checklist.');if(b.data.items.some(x=>!x?.id||!ids.has(x.checklistId)||!clean(x.text)))throw Error('Backup contains an invalid or orphaned item.')}
async function restoreBackup(b){validateBackup(b);const t=db.transaction(Object.values(STORES),'readwrite');Object.values(STORES).forEach(s=>t.objectStore(s).clear());Object.entries(b.data).forEach(([s,rows])=>rows.forEach(x=>t.objectStore(s).put(x)));await done(t)}
function download(data,name){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function header(selected){const title=selected?selected.title:state.view==='archive'?'ARCHIVE':state.view==='backup'?'BACKUP & RESTORE':'CHECKLISTS';return `<header><div class="top">${selected?'<button class="icon" data-act="back" aria-label="Back">‹</button>':'<div class="logo">✓</div>'}<button class="brand" data-act="home"><b>${esc(title)}</b><small>${selected?esc(catName(selected.categoryId)):'Local-first · v'+APP_VERSION}</small></button>${selected&&!selected.archived?'<button class="icon" data-act="edit-list" aria-label="Edit">✎</button><button class="icon" data-act="menu" aria-label="More">•••</button>':!selected&&state.view==='home'?'<button class="icon" data-act="archive-view" aria-label="Archive">▣</button><button class="icon" data-act="backup-view" aria-label="Backup">♢</button><button class="icon primary" data-act="new-list" aria-label="New checklist">＋</button>':''}</div>${!selected&&state.view!=='backup'?`<div class="search"><input id="search" value="${esc(state.query)}" placeholder="${state.view==='archive'?'Search archive':'Search lists, items or categories'}">${state.query?'<button class="icon clear" data-act="clear">×</button>':''}</div><div class="chips">${[{id:'all',name:'All'},...state.categories].map(c=>`<button class="chip ${state.category===c.id?'active':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div>`:''}</header>`}
function home(){const q=norm(state.query);let rows=state.checklists.map(c=>{const m=state.items.filter(i=>i.checklistId===c.id&&norm(i.text).includes(q)),title=!q||norm(c.title).includes(q),cat=q&&norm(catName(c.categoryId)).includes(q);return{c,m,title,ok:!q||title||cat||m.length}}).filter(x=>x.ok&&(state.category==='all'||x.c.categoryId===state.category)&&(state.view==='archive'?x.c.archived:!x.c.archived)).sort((a,b)=>Number(b.title)-Number(a.title)||Number(b.c.pinned)-Number(a.c.pinned)||a.c.sortOrder-b.c.sortOrder);if(!rows.length)return `<main><div class="empty">${state.query?'No results for “'+esc(state.query)+'”.':state.view==='archive'?'Archive is empty.':'Create your first checklist.'}</div></main>`;const pinned=state.view==='home'?rows.filter(x=>x.c.pinned):[],rest=state.view==='home'?rows.filter(x=>!x.c.pinned):rows;const cards=a=>a.map(x=>card(x)).join('');return `<main>${pinned.length?`<div class="section-title">Pinned</div>${cards(pinned)}`:''}<div class="section-title">${state.view==='archive'?'Archived':'Checklists'} (${rest.length})</div>${cards(rest)}</main>`}
function card(x){const p=prog(checklistItems(x.c.id)),match=!x.title&&x.m[0]?.text;return `<article class="card"><div class="cardrow"><button class="open" data-open="${x.c.id}"><b>${esc(x.c.title)} ${x.c.pinned?'⌖':''}</b><div class="meta">${esc(catName(x.c.categoryId))} · ${p.completed}/${p.total}</div>${match?`<div class="match">Item: ${esc(match)}</div>`:''}</button>${state.view==='archive'?`<button class="icon" data-restore="${x.c.id}">↶</button><button class="icon danger" data-delete-list="${x.c.id}">⌫</button>`:`<button class="icon" data-pin="${x.c.id}">${x.c.pinned?'⌖':'⌁'}</button>`}</div>${bar(p)}</article>`}
function detail(c){const items=checklistItems(c.id),p=prog(items);return `<main><div class="progress"><div class="prow"><b>${p.completed} of ${p.total} completed</b><small>${p.percent}%</small></div>${bar(p)}</div>${c.archived?'<button class="save" data-act="restore-selected">Restore checklist</button>':`<div class="actions"><button class="btn" ${p.completed?'':'disabled'} data-act="reset">↻ Reset</button><button class="btn primary" data-act="new-item">＋ Add item</button></div><div>${items.map(i=>`<div class="item ${i.completed?'done':''}"><button class="check" data-toggle="${i.id}"><span class="box">${i.completed?'✓':''}</span></button><button class="itemtext" data-edit-item="${i.id}">${esc(i.text)}</button><button class="icon danger" data-delete-item="${i.id}">⌫</button></div>`).join('')}</div>`}</main>`}
function backupView(){return `<main class="backup"><button class="btn" data-act="home">‹ Home</button><div class="panel" style="margin-top:10px;padding:16px"><b>Protect local data</b><p class="meta">Portable JSON backup of checklists, items, categories and settings.</p><button class="option" data-act="export"><b>Export full backup</b><div class="meta">${state.checklists.length} checklists · ${state.items.length} items</div></button><button class="option" data-act="import"><b>Restore backup</b><div class="meta">Validated before replacement</div></button><input id="restoreFile" type="file" accept="application/json,.json" hidden><div class="warn">A pre-restore safety backup is downloaded before current data is replaced.</div></div></main>`}
function sheet(){if(!state.modal&&!state.menu)return '';if(state.menu){return `<div class="overlay" data-act="close"><div class="sheet"><div class="handle"></div><div class="sheethead"><b>Checklist actions</b><button class="icon" data-act="close">×</button></div><button class="option" data-act="menu-pin">${state.checklists.find(x=>x.id===state.selectedId)?.pinned?'Unpin':'Pin'}</button><button class="option" data-act="menu-archive">Archive</button><button class="option danger" data-act="menu-delete">Delete permanently</button></div></div>`}const m=state.modal,isItem=m.type==='item',initial=m.initial||{},title=(initial.id?'Edit ':'New ')+(isItem?'item':'checklist');return `<div class="overlay" data-act="close"><div class="sheet"><div class="handle"></div><div class="sheethead"><b>${title}</b><button class="icon" data-act="close">×</button></div><form id="editForm"><label class="field">${isItem?'Item':'Title'}<input id="editText" autofocus value="${esc(isItem?initial.text||'':initial.title||'')}" placeholder="${isItem?'Passport':'Travel Packing'}"></label>${!isItem?`<label class="field">Category<select id="editCat"><option value="">No category</option>${state.categories.map(c=>`<option value="${c.id}" ${initial.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`:''}<button class="save">Save</button></form></div></div>`}
function render(){const selected=state.checklists.find(x=>x.id===state.selectedId);$('#app').innerHTML=`<div class="app">${header(selected)}${state.error?`<div class="error">${esc(state.error)}</div>`:''}${state.message?`<div class="notice">${esc(state.message)}</div>`:''}${state.view==='backup'&&!selected?backupView():selected?detail(selected):home()}</div>${sheet()}`;bind()}
function bind(){document.querySelectorAll('[data-act]').forEach(el=>el.onclick=e=>{if(e.target.classList.contains('overlay'))doAct(el.dataset.act);else if(!el.classList.contains('overlay'))doAct(el.dataset.act)});document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{state.category=el.dataset.cat;render()});document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{state.selectedId=el.dataset.open;render()});document.querySelectorAll('[data-pin]').forEach(el=>el.onclick=()=>{const c=state.checklists.find(x=>x.id===el.dataset.pin);act(()=>updateChecklist(c,{pinned:!c.pinned}))});document.querySelectorAll('[data-restore]').forEach(el=>el.onclick=()=>{const c=state.checklists.find(x=>x.id===el.dataset.restore);act(()=>updateChecklist(c,{archived:false}))});document.querySelectorAll('[data-delete-list]').forEach(el=>el.onclick=()=>{const c=state.checklists.find(x=>x.id===el.dataset.deleteList);if(confirm(`Permanently delete “${c.title}” and all its items?`))act(()=>deleteChecklist(c.id))});document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{const i=state.items.find(x=>x.id===el.dataset.toggle);act(()=>updateItem(i,{completed:!i.completed}))});document.querySelectorAll('[data-edit-item]').forEach(el=>el.onclick=()=>{state.modal={type:'item',initial:state.items.find(x=>x.id===el.dataset.editItem)};render()});document.querySelectorAll('[data-delete-item]').forEach(el=>el.onclick=()=>{const i=state.items.find(x=>x.id===el.dataset.deleteItem);if(confirm(`Delete “${i.text}”?`))act(()=>deleteItem(i.id))});const s=$('#search');if(s)s.oninput=()=>{state.query=s.value;render()};const f=$('#editForm');if(f)f.onsubmit=e=>{e.preventDefault();saveForm()};const rf=$('#restoreFile');if(rf)rf.onchange=()=>importBackup(rf.files?.[0])}
async function saveForm(){const m=state.modal,text=clean($('#editText').value),cat=$('#editCat')?.value||'';if(!text)return;await act(async()=>{if(m.type==='item'){if(m.initial?.id)await updateItem(m.initial,{text});else await createItem(state.selectedId,text)}else{if(m.initial?.id)await updateChecklist(m.initial,{title:text,categoryId:cat||null});else{const c=await createChecklist(text,cat);state.selectedId=c.id}}state.modal=null})}
async function importBackup(file){if(!file)return;try{const b=JSON.parse(await file.text());validateBackup(b);if(!confirm(`Restore ${b.data.checklists.length} checklists and ${b.data.items.length} items? This replaces current data.`))return;download(await makeBackup(),`lifeapps-checklists-pre-restore-${new Date().toISOString().slice(0,10)}.json`);await restoreBackup(b);state.selectedId=null;state.view='home';state.message='Restore completed. A safety backup was downloaded first.';await refresh()}catch(e){state.error=e instanceof SyntaxError?'The selected file is not valid JSON.':e.message;render()}}
function doAct(a){const c=state.checklists.find(x=>x.id===state.selectedId);if(a==='home'){state.selectedId=null;state.view='home';state.query='';state.category='all';render()}else if(a==='back'){state.selectedId=null;render()}else if(a==='new-list'){state.modal={type:'list'};render()}else if(a==='edit-list'){state.modal={type:'list',initial:c};render()}else if(a==='new-item'){state.modal={type:'item'};render()}else if(a==='menu'){state.menu=true;render()}else if(a==='close'){state.modal=null;state.menu=false;render()}else if(a==='archive-view'){state.view='archive';state.query='';state.category='all';render()}else if(a==='backup-view'){state.view='backup';render()}else if(a==='clear'){state.query='';render()}else if(a==='reset'){const p=prog(checklistItems(c.id));if(p.completed&&confirm(`Reset ${p.completed} completed item${p.completed===1?'':'s'}?`))act(()=>resetChecklist(c.id))}else if(a==='restore-selected'){act(async()=>{await updateChecklist(c,{archived:false});state.selectedId=null})}else if(a==='menu-pin'){state.menu=false;act(()=>updateChecklist(c,{pinned:!c.pinned}))}else if(a==='menu-archive'){state.menu=false;if(confirm(`Archive “${c.title}”?`))act(async()=>{await updateChecklist(c,{archived:true,pinned:false});state.selectedId=null})}else if(a==='menu-delete'){state.menu=false;if(confirm(`Permanently delete “${c.title}” and all its items?`))act(async()=>{await deleteChecklist(c.id);state.selectedId=null})}else if(a==='export'){act(async()=>{download(await makeBackup(),`lifeapps-checklists-backup-${new Date().toISOString().slice(0,10)}.json`);state.message='Full backup downloaded.'})}else if(a==='import')$('#restoreFile').click()}
(async()=>{try{db=await openDB();await seed();await refresh()}catch(e){document.querySelector('#app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}})();
})();

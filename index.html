<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Checklists</title><style>
:root{--n:#0f172a;--m:#64748b;--l:#e2e8f0;--b:#f8fafc;--r:#dc2626}*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:var(--n);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}button,input,select{font:inherit}.app{max-width:620px;min-height:100dvh;margin:auto;background:var(--b)}header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--l);padding:max(10px,env(safe-area-inset-top)) 14px 10px}.top,.row,.actions{display:flex;align-items:center;gap:7px}.logo{width:36px;height:36px;border-radius:12px;background:var(--n);color:white;display:grid;place-items:center;font-weight:900}.brand{flex:1;min-width:0;border:0;background:none;text-align:left}.brand b,.brand small{display:block}.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small,.meta{color:var(--m);font-size:11px}.icon{min-width:44px;min-height:44px;border:0;border-radius:12px;background:transparent}.primary,.save{background:var(--n)!important;color:white}.search{margin-top:8px}.search input,.field input,.field select{width:100%;min-height:46px;border:1px solid var(--l);border-radius:12px;padding:0 13px;background:white;font-size:16px}.chips{display:flex;gap:6px;overflow:auto;margin-top:8px}.chip{flex:none;min-height:28px;border:0;border-radius:8px;padding:0 9px;font-size:11px;font-weight:700}.chip.on{background:var(--n);color:white}main{padding:12px 12px max(30px,env(safe-area-inset-bottom))}.title{margin:8px 2px 4px;color:var(--m);font-size:11px;font-weight:900;text-transform:uppercase}.card,.panel,.item{background:white;border:1px solid var(--l);border-radius:16px}.card{padding:7px 8px;margin-bottom:0;border-width:0 0 1px;border-radius:0;box-shadow:none}.open{flex:1;min-width:0;min-height:44px;border:0;background:none;text-align:left}.bar{height:3px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--n)}.btn{min-height:44px;border:1px solid var(--l);border-radius:12px;background:white;padding:0 13px;font-weight:700}.actions{justify-content:space-between;margin-bottom:10px}.item{min-height:45px;padding:0;border-width:0 0 1px;border-radius:0;margin-bottom:0;background:transparent}.itemtext{flex:1;border:0;background:none;text-align:left}.done .itemtext{text-decoration:line-through;color:#94a3b8}.box{width:25px;height:25px;border:1px solid #cbd5e1;border-radius:8px;display:grid;place-items:center}.done .box{background:var(--n);color:white}.danger{color:var(--r)}.empty{text-align:center;color:var(--m);margin-top:80px}.notice,.error{margin:10px 12px;padding:10px;border-radius:12px;font-size:13px}.notice{background:#ecfdf5;color:#047857}.error{background:#fef2f2;color:#b91c1c}.overlay{position:fixed;inset:0;z-index:50;background:#0f172a70;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:440px;background:white;border-radius:24px 24px 0 0;padding:15px 20px max(20px,env(safe-area-inset-bottom));max-height:calc(100dvh - 24px);overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.field{display:block;margin-top:12px;font-size:13px;font-weight:700}.field input,.field select{margin-top:6px}.save{width:100%;min-height:48px;border:0;border-radius:14px;margin-top:16px;font-weight:800}.settingrow{display:flex;align-items:center;gap:8px;min-height:54px;border-top:1px solid var(--l)}.settingrow:first-of-type{border-top:0}.settingname{flex:1}.system{font-size:10px;color:var(--m);margin-left:6px}.pausepoint{min-height:34px;display:flex;align-items:center;gap:7px;color:var(--m)}.pausepoint:before{content:'';height:1px;background:var(--l);width:14px;flex:0 0 14px}.pausepoint:after{content:'';height:1px;background:var(--l);flex:1}.pausetext{flex:0 1 auto;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;color:#475569;font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:0}.pausemore{min-width:40px;min-height:34px;border:0;background:transparent;color:#94a3b8;border-radius:10px}.grip{min-width:44px;min-height:44px;border:0;background:transparent;color:#94a3b8;font-size:19px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.grip:active{cursor:grabbing}.dragging{opacity:.48;background:#f8fafc}.dragover{background:#eef2f7}.reorder-active{overscroll-behavior:contain}.subtledelete{display:block;margin:12px auto 0;border:0;background:transparent;color:#b91c1c;font-size:12px;font-weight:700;min-height:40px;padding:0 12px}.addchoice{width:100%;min-height:50px;border:0;border-radius:12px;background:#f8fafc;text-align:left;padding:6px 14px;margin-top:8px;font-weight:750}.addchoice small{display:block;color:var(--m);font-size:11px;font-weight:500;margin-top:2px}.warn{background:#fffbeb;color:#92400e;padding:11px;border-radius:12px;font-size:12px;margin-top:12px}.storageguard{max-width:520px;margin:70px auto 0;padding:22px}.storageguard h1{font-size:20px;margin:0 0 8px}.storageguard p{color:var(--m);font-size:14px;line-height:1.55}.storageguard code{display:block;margin-top:10px;padding:10px;border-radius:10px;background:#f1f5f9;font-size:12px;overflow:auto}.storageguard .badge{display:inline-block;margin-bottom:10px;padding:4px 8px;border-radius:99px;background:#fffbeb;color:#92400e;font-size:11px;font-weight:800}@media(min-width:640px){.overlay{align-items:center;padding:20px}.sheet{border-radius:24px}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';const DB='lifeapps-checklists',VER=1,APP='0.2.7.2',FORMAT='lifeapps-checklists-backup',SCHEMA=1,S=['checklists','items','categories','settings'];const BUILT=[['cat_personal','Personal',100],['cat_home','Home',200],['cat_travel','Travel',300],['cat_work','Work',400],['cat_shopping','Shopping',500],['cat_other','Other',600]];let db,st={checklists:[],items:[],categories:[],settings:[],selected:null,query:'',cat:'all',view:'home',modal:null,searchOpen:false,msg:'',err:''};const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clean=s=>String(s??'').trim(),norm=s=>clean(s).toLowerCase(),now=()=>new Date().toISOString(),id=p=>p+'_'+crypto.randomUUID(),rq=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)}),td=t=>new Promise((a,b)=>{t.oncomplete=a;t.onerror=()=>b(t.error);t.onabort=()=>b(t.error||Error('Transaction aborted'))});
function storageContextMessage(err){const localFile=location.protocol==='file:';const denied=err&&(err.name==='SecurityError'||/denied|not allowed|security/i.test(err.message||''));if(localFile||denied)return {title:'Local storage is unavailable here',body:'Checklists uses IndexedDB to keep your data safely in this browser. This browser is blocking IndexedDB for the current file context.',localFile,detail:localFile?'Open this app from GitHub Pages or serve the file through http://localhost instead of opening it directly with file://.':'Open the app from a normal HTTPS website such as GitHub Pages, or check whether browser privacy/security policy is blocking site storage.'};return null}
function renderStorageGuard(info){const app=document.querySelector('#app');app.innerHTML=`<div class="app"><div class="storageguard panel"><span class="badge">Storage environment</span><h1>${esc(info.title)}</h1><p>${esc(info.body)}</p><p><b>Recommended:</b> ${esc(info.detail)}</p>${info.localFile?'<code>python -m http.server 8000<br>Then open: http://localhost:8000/</code>':''}<p>Your Checklists data model has not been changed. IndexedDB v1 remains the authoritative store.</p></div></div>`}
function open(){return new Promise((a,b)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('checklists')){let s=d.createObjectStore('checklists',{keyPath:'id'});s.createIndex('by_archived','archived');s.createIndex('by_category','categoryId');s.createIndex('by_updated','updatedAt')}if(!d.objectStoreNames.contains('items')){let s=d.createObjectStore('items',{keyPath:'id'});s.createIndex('by_checklist','checklistId');s.createIndex('by_checklist_sort',['checklistId','sortOrder'])}if(!d.objectStoreNames.contains('categories')){let s=d.createObjectStore('categories',{keyPath:'id'});s.createIndex('by_name','name')}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}async function all(n){return rq(db.transaction(n,'readonly').objectStore(n).getAll())}async function seed(){let t=db.transaction(['categories','settings'],'readwrite'),c=t.objectStore('categories');if(!(await rq(c.count()))){let z=now();BUILT.forEach(([id,name,sortOrder])=>c.add({id,name,sortOrder,isSystem:true,createdAt:z,updatedAt:z}))}let ss=t.objectStore('settings');if(!(await rq(ss.get('general'))))ss.put({key:'general',value:{defaultView:'home',updatedAt:now()}});await td(t)}async function refresh(){[st.checklists,st.items,st.categories,st.settings]=await Promise.all(S.map(all));st.categories.sort((a,b)=>a.sortOrder-b.sortOrder);render()}async function act(f){try{st.err='';st.msg='';await f();await refresh()}catch(e){st.err=e.message||'Change could not be saved.';render()}}
async function saveSettings(p){let old=st.settings.find(x=>x.key==='general')?.value||{},t=db.transaction('settings','readwrite');t.objectStore('settings').put({key:'general',value:{...old,...p,updatedAt:now()}});await td(t)}async function addCat(name){name=clean(name);if(!name)throw Error('Category name is required.');if(st.categories.some(x=>norm(x.name)===norm(name)))throw Error('Category already exists.');let t=db.transaction('categories','readwrite'),z=now(),max=Math.max(0,...st.categories.map(x=>+x.sortOrder||0));t.objectStore('categories').add({id:id('cat'),name,sortOrder:max+100,isSystem:false,createdAt:z,updatedAt:z});await td(t)}async function renameCat(c,name){if(c.isSystem)throw Error('Built-in categories are protected.');name=clean(name);if(!name)throw Error('Category name is required.');if(st.categories.some(x=>x.id!==c.id&&norm(x.name)===norm(name)))throw Error('Category already exists.');let t=db.transaction('categories','readwrite');t.objectStore('categories').put({...c,name,updatedAt:now()});await td(t)}async function delCat(c){if(c.isSystem)throw Error('Built-in categories are protected.');if(st.checklists.some(x=>x.categoryId===c.id))throw Error('Move checklists out of this category first.');let t=db.transaction('categories','readwrite');t.objectStore('categories').delete(c.id);await td(t)}
async function addList(title,categoryId){title=clean(title);if(!title)throw Error('Checklist title is required.');let z=now(),r={id:id('cl'),title,categoryId:categoryId||null,pinned:false,archived:false,sortOrder:(st.checklists.length+1)*1000,createdAt:z,updatedAt:z},t=db.transaction('checklists','readwrite');t.objectStore('checklists').add(r);await td(t);return r}async function updList(c,p){let title=p.title===undefined?c.title:clean(p.title);if(!title)throw Error('Checklist title is required.');let t=db.transaction('checklists','readwrite');t.objectStore('checklists').put({...c,...p,title,updatedAt:now()});await td(t)}async function delList(cid){let t=db.transaction(['checklists','items'],'readwrite'),idx=t.objectStore('items').index('by_checklist');await new Promise((a,b)=>{let r=idx.openCursor(IDBKeyRange.only(cid));r.onsuccess=e=>{let c=e.target.result;if(!c)return a();c.delete();c.continue()};r.onerror=()=>b(r.error)});t.objectStore('checklists').delete(cid);await td(t)}const listItems=cid=>st.items.filter(x=>x.checklistId===cid).sort((a,b)=>a.sortOrder-b.sortOrder);async function addItem(cid,text){text=clean(text);if(!text)throw Error('Item is required.');let a=listItems(cid),z=now(),t=db.transaction('items','readwrite');t.objectStore('items').add({id:id('item'),checklistId:cid,type:'item',text,completed:false,sortOrder:(a.length+1)*1000,createdAt:z,updatedAt:z});await td(t)}async function reorderRow(dragId,targetId){if(!dragId||!targetId||dragId===targetId)return;let rows=listItems(st.selected),from=rows.findIndex(x=>x.id===dragId),to=rows.findIndex(x=>x.id===targetId);if(from<0||to<0)return;let [moved]=rows.splice(from,1);rows.splice(to,0,moved);let t=db.transaction('items','readwrite'),store=t.objectStore('items'),z=now();rows.forEach((r,i)=>store.put({...r,sortOrder:(i+1)*1000,updatedAt:r.id===dragId?z:r.updatedAt}));await td(t)}async function addPause(cid,text){text=clean(text);if(!text)throw Error('Pause point is required.');let a=listItems(cid),z=now(),t=db.transaction('items','readwrite');t.objectStore('items').add({id:id('item'),checklistId:cid,type:'pause',text,sortOrder:(a.length+1)*1000,createdAt:z,updatedAt:z});await td(t)}async function updItem(i,p){let text=p.text===undefined?i.text:clean(p.text);if(!text)throw Error('Item is required.');let t=db.transaction('items','readwrite');t.objectStore('items').put({...i,...p,text,updatedAt:now()});await td(t)}async function delItem(i){let t=db.transaction('items','readwrite');t.objectStore('items').delete(i);await td(t)}async function reset(cid){let t=db.transaction('items','readwrite'),idx=t.objectStore('items').index('by_checklist'),z=now();await new Promise((a,b)=>{let r=idx.openCursor(IDBKeyRange.only(cid));r.onsuccess=e=>{let c=e.target.result;if(!c)return a();if(isTask(c.value)&&c.value.completed)c.update({...c.value,completed:false,updatedAt:z});c.continue()};r.onerror=()=>b(r.error)});await td(t)}const isTask=i=>!i.type||i.type==='item',prog=a=>{let tasks=a.filter(isTask),total=tasks.length,completed=tasks.filter(x=>x.completed).length;return{total,completed,percent:total?Math.round(completed/total*100):0}},cat=id=>st.categories.find(x=>x.id===id)?.name||'No category',bar=p=>`<div class="bar"><i style="width:${p.percent}%"></i></div>`;
async function backup(){let [checklists,items,categories,settings]=await Promise.all(S.map(all));return{app:'LIFEAPPS Checklists',format:FORMAT,schemaVersion:SCHEMA,appVersion:APP,exportedAt:now(),data:{checklists,items,categories,settings}}}function valid(b){if(!b||b.format!==FORMAT||b.schemaVersion!==SCHEMA)throw Error('Unsupported Checklists backup.');if(!b.data||!S.every(k=>Array.isArray(b.data[k])))throw Error('Backup is incomplete.');let ids=new Set(b.data.checklists.map(x=>x.id));if(b.data.items.some(x=>!ids.has(x.checklistId)))throw Error('Backup contains orphaned items.')}async function restore(b){valid(b);let t=db.transaction(S,'readwrite');S.forEach(s=>t.objectStore(s).clear());Object.entries(b.data).forEach(([s,a])=>a.forEach(x=>t.objectStore(s).put(x)));await td(t)}function dl(data,name){let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function head(sel){let title=sel?sel.title:st.view==='archive'?'ARCHIVE':st.view==='backup'?'BACKUP & RESTORE':st.view==='settings'?'SETTINGS':'CHECKLISTS';return `<header><div class="top">${sel?'<button class="icon" data-a="back">‹</button>':'<div class="logo" aria-label="Checklists"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8"/></svg></div>'}<button class="brand" data-a="home"><b>${esc(title)}</b><small>${sel?esc(cat(sel.categoryId)):'Local-first · v'+APP}</small></button>${sel&&!sel.archived?'<button class="icon" data-a="edit-list">✎</button><button class="icon" data-a="menu">•••</button>':!sel&&st.view==='home'?'<button class="icon" data-a="search" aria-label="Search"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button><button class="icon" data-a="settings" aria-label="Settings">⚙</button><button class="icon primary" data-a="new-list" aria-label="New checklist">＋</button>':''}</div>${!sel&&['home','archive'].includes(st.view)?`${st.searchOpen?`<div class="search"><input id="search" value="${esc(st.query)}" placeholder="Search lists, items or categories" autofocus></div>`:''}<div class="chips">${[{id:'all',name:'All'},...st.categories].map(c=>`<button class="chip ${st.cat===c.id?'on':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div>`:''}</header>`}
function home(){let q=norm(st.query),rows=st.checklists.map(c=>{let m=st.items.filter(i=>i.checklistId===c.id&&norm(i.text).includes(q)),title=!q||norm(c.title).includes(q),cm=q&&norm(cat(c.categoryId)).includes(q);return{c,m,title,ok:!q||title||cm||m.length}}).filter(x=>x.ok&&(st.cat==='all'||x.c.categoryId===st.cat)&&(st.view==='archive'?x.c.archived:!x.c.archived)).sort((a,b)=>Number(b.title)-Number(a.title)||Number(b.c.pinned)-Number(a.c.pinned)||a.c.sortOrder-b.c.sortOrder);if(!rows.length)return `<main><div class="empty">${st.view==='archive'?'Archive is empty.':'No matching checklists.'}</div></main>`;let pinned=st.view==='home'?rows.filter(x=>x.c.pinned):[],rest=st.view==='home'?rows.filter(x=>!x.c.pinned):rows,card=x=>{let p=prog(listItems(x.c.id));return `<div class="card"><div class="row"><button class="open" data-open="${x.c.id}"><b>${esc(x.c.title)}</b><div class="meta">${esc(cat(x.c.categoryId))} · ${p.completed}/${p.total}</div>${!x.title&&x.m[0]?`<div class="meta" style="color:#1d4ed8">Item: ${esc(x.m[0].text)}</div>`:''}</button>${st.view==='archive'?`<button class="icon" data-restore="${x.c.id}">↶</button><button class="icon danger" data-del-list="${x.c.id}">⌫</button>`:`<button class="icon" data-pin="${x.c.id}">${x.c.pinned?'⌖':'⌁'}</button>`}</div>${bar(p)}</div>`};return `<main>${pinned.length?`<div class="title">Pinned</div>${pinned.map(card).join('')}`:''}<div class="title">${st.view==='archive'?'Archived':'Checklists'} (${rest.length})</div>${rest.map(card).join('')}</main>`}
function detail(c){let rows=listItems(c.id),p=prog(rows);return `<main style="padding-top:6px">${c.archived?'<button class="save" data-a="restore-selected">Restore checklist</button>':`<div class="actions" style="min-height:40px;margin-bottom:0;border-bottom:1px solid var(--l)"><button class="btn" style="min-height:40px;border:0;background:transparent;padding-left:4px" data-a="reset" ${p.completed?'':'disabled'}>↻ Reset</button><button class="btn primary" style="min-height:40px" data-a="add-choice">＋ Add</button></div>${rows.map(i=>i.type==='pause'?`<div class="pausepoint" data-row="${i.id}"><button class="pausetext" data-edit-pause="${i.id}">Pause · ${esc(i.text)}</button><button class="grip" data-grip="${i.id}" aria-label="Move pause point">≡</button></div>`:`<div class="item row ${i.completed?'done':''}" data-row="${i.id}"><button class="icon" data-toggle="${i.id}" aria-label="${i.completed?'Uncheck':'Check'} item"><span class="box">${i.completed?'✓':''}</span></button><button class="itemtext" data-edit-item="${i.id}">${esc(i.text)}</button><button class="grip" data-grip="${i.id}" aria-label="Move item">≡</button></div>`).join('')}`}</main>`}
function settings(){let g=st.settings.find(x=>x.key==='general')?.value||{};return `<main><button class="btn" data-a="home">‹ Home</button><div class="panel" style="padding:15px;margin-top:10px"><b>Settings</b><p class="meta">Preferences are stored in IndexedDB and included in backups.</p><label class="field">Default view<select id="defaultView"><option value="home" ${g.defaultView!=='archive'?'selected':''}>Home</option><option value="archive" ${g.defaultView==='archive'?'selected':''}>Archive</option></select></label><button class="save" data-a="save-settings">Save settings</button></div><div class="panel" style="padding:15px;margin-top:10px"><b>Data</b><div class="settingrow"><button class="itemtext" data-a="archive">Archive</button><span class="meta">${st.checklists.filter(x=>x.archived).length}</span></div><div class="settingrow"><button class="itemtext" data-a="backup">Backup & Restore</button><span class="meta">JSON</span></div></div><div class="panel" style="padding:15px;margin-top:10px"><div class="actions"><b>Categories</b><button class="btn" data-a="new-cat">＋ Add</button></div><div class="meta" style="margin-bottom:7px">Built-in categories are protected. Custom categories can be renamed or deleted when unused.</div>${st.categories.map(c=>`<div class="settingrow"><div class="settingname">${esc(c.name)}${c.isSystem?'<span class="system">Built-in</span>':''}</div>${c.isSystem?'':`<button class="icon" data-edit-cat="${c.id}">✎</button><button class="icon danger" data-del-cat="${c.id}">⌫</button>`}</div>`).join('')}</div></main>`}
function backupView(){return `<main><button class="btn" data-a="home">‹ Home</button><div class="panel" style="padding:15px;margin-top:10px"><b>Backup & Restore</b><p class="meta">Full portable backup includes checklists, items, categories and settings.</p><button class="save" data-a="export">Export full backup</button><button class="btn" style="width:100%;margin-top:8px" data-a="import">Restore backup</button><input id="file" type="file" accept=".json,application/json" hidden><div class="warn">A pre-restore safety backup is downloaded before replacement.</div></div></main>`}
function sheet(){if(st.modal){let m=st.modal;if(m.type==='addchoice'){return `<div class="overlay"><div class="sheet"><div class="sheethead"><b>Add</b><button class="icon" data-a="close">×</button></div><button class="addchoice" data-a="new-item">✓ Checklist item<small>A checkable step</small></button><button class="addchoice" data-a="new-pause">Ⅱ Pause point<small>A moment to stop and check</small></button></div></div>`}if(m.type==='pause'){let i=m.initial||{};return `<div class="overlay"><div class="sheet"><div class="sheethead"><b>${i.id?'Edit':'New'} pause point</b><button class="icon" data-a="close">×</button></div><form id="pauseForm"><label class="field">Pause point<input id="pauseText" autofocus value="${esc(i.text||'')}" placeholder="Before leaving home"></label><button class="save">Save changes</button>${i.id?'<button type="button" class="subtledelete" data-a="delete-open-pause">Delete pause point</button>':''}</form></div></div>`}if(m.type==='cat'){let i=m.initial||{};return `<div class="overlay"><div class="sheet"><div class="sheethead"><b>${i.id?'Rename':'New'} category</b><button class="icon" data-a="close">×</button></div><form id="catForm"><label class="field">Name<input id="catName" autofocus value="${esc(i.name||'')}"></label><button class="save">Save</button></form></div></div>`}let item=m.type==='item',i=m.initial||{};return `<div class="overlay"><div class="sheet"><div class="sheethead"><b>${i.id?'Edit':'New'} ${item?'item':'checklist'}</b><button class="icon" data-a="close">×</button></div><form id="form"><label class="field">${item?'Item':'Title'}<input id="text" autofocus value="${esc(item?i.text||'':i.title||'')}"></label>${item?'':`<label class="field">Category<select id="listCat"><option value="">No category</option>${st.categories.map(c=>`<option value="${c.id}" ${i.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`}<button class="save">${item&&i.id?'Save changes':'Save'}</button>${item&&i.id?'<button type="button" class="subtledelete" data-a="delete-open-item">Delete item</button>':''}</form></div></div>`}return ''}
function render(){let sel=st.checklists.find(x=>x.id===st.selected);$('#app').innerHTML=`<div class="app">${head(sel)}${st.err?`<div class="error">${esc(st.err)}</div>`:''}${st.msg?`<div class="notice">${esc(st.msg)}</div>`:''}${sel?detail(sel):st.view==='settings'?settings():st.view==='backup'?backupView():home()}</div>${sheet()}`;bind()}
function bind(){document.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>go(e.dataset.a));document.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>{st.cat=e.dataset.cat;render()});document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{st.selected=e.dataset.open;render()});document.querySelectorAll('[data-pin]').forEach(e=>e.onclick=()=>{let c=st.checklists.find(x=>x.id===e.dataset.pin);act(()=>updList(c,{pinned:!c.pinned}))});document.querySelectorAll('[data-restore]').forEach(e=>e.onclick=()=>{let c=st.checklists.find(x=>x.id===e.dataset.restore);act(()=>updList(c,{archived:false}))});document.querySelectorAll('[data-del-list]').forEach(e=>e.onclick=()=>{let c=st.checklists.find(x=>x.id===e.dataset.delList);if(confirm(`Permanently delete “${c.title}”?`))act(()=>delList(c.id))});document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{let i=st.items.find(x=>x.id===e.dataset.toggle);act(()=>updItem(i,{completed:!i.completed}))});document.querySelectorAll('[data-edit-pause]').forEach(e=>e.onclick=()=>{st.modal={type:'pause',initial:st.items.find(x=>x.id===e.dataset.editPause)};render()});(()=>{let drag=null,startY=0,active=false,targetId=null;const clear=()=>{document.body.classList.remove('reorder-active');document.querySelectorAll('.dragging,.dragover').forEach(x=>x.classList.remove('dragging','dragover'));drag=null;active=false;targetId=null};document.querySelectorAll('[data-grip]').forEach(grip=>{grip.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;drag=grip.closest('[data-row]');if(!drag)return;startY=e.clientY;active=false;targetId=drag.dataset.row;try{grip.setPointerCapture(e.pointerId)}catch(_){};document.body.classList.add('reorder-active')});grip.addEventListener('pointermove',e=>{if(!drag)return;if(!active&&Math.abs(e.clientY-startY)<7)return;active=true;e.preventDefault();drag.classList.add('dragging');const hit=document.elementFromPoint(e.clientX,e.clientY),row=hit&&hit.closest('[data-row]');document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));if(row&&row!==drag){targetId=row.dataset.row;row.classList.add('dragover')}});const finish=e=>{if(!drag)return;const dragId=drag.dataset.row,to=targetId;try{grip.releasePointerCapture(e.pointerId)}catch(_){};clear();if(active&&to&&dragId!==to)act(()=>reorderRow(dragId,to))};grip.addEventListener('pointerup',finish);grip.addEventListener('pointercancel',e=>{try{grip.releasePointerCapture(e.pointerId)}catch(_){};clear()})})})();document.querySelectorAll('[data-edit-item]').forEach(e=>e.onclick=()=>{st.modal={type:'item',initial:st.items.find(x=>x.id===e.dataset.editItem)};render()});document.querySelectorAll('[data-del-item]').forEach(e=>e.onclick=()=>{let i=st.items.find(x=>x.id===e.dataset.delItem);if(confirm(`Delete “${i.text}”?`))act(()=>delItem(i.id))});document.querySelectorAll('[data-edit-cat]').forEach(e=>e.onclick=()=>{st.modal={type:'cat',initial:st.categories.find(x=>x.id===e.dataset.editCat)};render()});document.querySelectorAll('[data-del-cat]').forEach(e=>e.onclick=()=>{let c=st.categories.find(x=>x.id===e.dataset.delCat);if(confirm(`Delete category “${c.name}”?`))act(()=>delCat(c))});let s=$('#search');if(s)s.oninput=()=>{st.query=s.value;render()};let f=$('#form');if(f)f.onsubmit=e=>{e.preventDefault();saveForm()};let cf=$('#catForm');if(cf)cf.onsubmit=e=>{e.preventDefault();saveCat()};let pf=$('#pauseForm');if(pf)pf.onsubmit=e=>{e.preventDefault();savePause()};let file=$('#file');if(file)file.onchange=()=>importFile(file.files?.[0])}
async function saveForm(){let m=st.modal,v=clean($('#text').value),c=$('#listCat')?.value||'';if(!v)return;await act(async()=>{if(m.type==='item'){m.initial?.id?await updItem(m.initial,{text:v}):await addItem(st.selected,v)}else if(m.initial?.id)await updList(m.initial,{title:v,categoryId:c||null});else{let n=await addList(v,c);st.selected=n.id}st.modal=null})}async function saveCat(){let m=st.modal,v=clean($('#catName').value);if(!v)return;await act(async()=>{m.initial?.id?await renameCat(m.initial,v):await addCat(v);st.modal=null})}async function savePause(){let m=st.modal,v=clean($('#pauseText').value);if(!v)return;await act(async()=>{m.initial?.id?await updItem(m.initial,{text:v,type:'pause'}):await addPause(st.selected,v);st.modal=null})}async function importFile(file){if(!file)return;try{let b=JSON.parse(await file.text());valid(b);if(!confirm(`Restore ${b.data.checklists.length} checklists? This replaces current data.`))return;dl(await backup(),`lifeapps-checklists-pre-restore-${new Date().toISOString().slice(0,10)}.json`);await restore(b);st.view='home';st.selected=null;await refresh();st.msg='Restore completed.';render()}catch(e){st.err=e.message;render()}}
function go(a){let c=st.checklists.find(x=>x.id===st.selected);if(a==='home'){st.selected=null;st.view='home';st.query='';st.searchOpen=false;st.cat='all';render()}else if(a==='back'){st.selected=null;render()}else if(a==='archive'){st.view='archive';st.searchOpen=false;st.query='';render()}else if(a==='settings'){st.view='settings';st.searchOpen=false;render()}else if(a==='search'){st.searchOpen=!st.searchOpen;if(!st.searchOpen)st.query='';render()}else if(a==='backup'){st.view='backup';render()}else if(a==='new-list'){st.modal={type:'list'};render()}else if(a==='edit-list'){st.modal={type:'list',initial:c};render()}else if(a==='add-choice'){st.modal={type:'addchoice'};render()}else if(a==='new-item'){st.modal={type:'item'};render()}else if(a==='new-pause'){st.modal={type:'pause'};render()}else if(a==='close'){st.modal=null;render()}else if(a==='delete-open-item'){let i=st.modal?.initial;if(i&&confirm(`Delete “${i.text}”?`)){st.modal=null;act(()=>delItem(i.id))}}else if(a==='delete-open-pause'){let i=st.modal?.initial;if(i&&confirm(`Delete pause point “${i.text}”?`)){st.modal=null;act(()=>delItem(i.id))}}else if(a==='new-cat'){st.modal={type:'cat'};render()}else if(a==='save-settings'){let v=$('#defaultView').value;act(async()=>{await saveSettings({defaultView:v});st.msg='Settings saved.'})}else if(a==='reset'){let p=prog(listItems(c.id));if(p.completed&&confirm(`Reset ${p.completed} completed items?`))act(()=>reset(c.id))}else if(a==='menu'){if(confirm(`Archive “${c.title}”?`))act(async()=>{await updList(c,{archived:true,pinned:false});st.selected=null})}else if(a==='restore-selected'){act(async()=>{await updList(c,{archived:false});st.selected=null})}else if(a==='export'){act(async()=>{dl(await backup(),`lifeapps-checklists-backup-${new Date().toISOString().slice(0,10)}.json`);st.msg='Full backup downloaded.'})}else if(a==='import')$('#file').click()}
(async()=>{try{if(!('indexedDB' in window))throw new DOMException('IndexedDB is not available in this browser context.','SecurityError');db=await open();await seed();await refresh()}catch(e){const info=storageContextMessage(e);if(info)renderStorageGuard(info);else $('#app').innerHTML='<div class="error">'+esc(e.message||'Unable to open local storage.')+'</div>'}})();})();
</script></body></html>
